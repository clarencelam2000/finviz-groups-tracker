name: Tests
on:
  push:
    branches-ignore:
      - 'claude/elegant-babbage-hlxnfy'
  pull_request:
    branches:
      - 'claude/elegant-babbage-hlxnfy'
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-test.txt -r requirements-dev.txt
      - name: Run tests
        run: |
          pytest tests/ -v \
            --ignore=tests/test_collect_parsing.py \
            --ignore=tests/test_functional_playwright.py \
            --ignore=tests/test_pwa_picks_hod.py \
            --ignore=tests/test_pwa_picks_atr_earnings.py \
            --ignore=tests/test_pwa_focus_scoring.py \
            --ignore=tests/test_pwa_picks_chart.py \
            --ignore=tests/test_pwa_lookup_signal.py \
            --ignore=tests/test_pwa_ai_group_chips.py \
            --ignore=tests/test_pwa_morning.py \
            --ignore=tests/test_pwa_trade_ticket.py \
            --ignore=tests/test_pwa_positions.py \
            --ignore=tests/test_pwa_manual_entry.py \
            --ignore=tests/test_pwa_watchlist.py \
            --ignore=tests/test_pwa_preclose.py \
            --ignore=tests/test_pwa_push.py \
            --ignore=tests/test_pwa_volatility_gate.py
      - name: Run eval_ai guards on captured outputs (if any)
        run: python scripts/eval_ai.py --all

  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Run worker tests
        working-directory: worker
        run: npm test

  worker-cron-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install worker-cron dependencies
        working-directory: worker-cron
        run: npm ci
      - name: Run worker-cron tests
        working-directory: worker-cron
        run: npm test

  worker-positions-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node 22, not the 20 used by the other worker-* jobs: the WS5 phase-3b test harness
      # (test/helpers/d1.js) uses Node 22's built-in `node:sqlite` to run the REAL D1 migrations
      # against an in-memory DB, instead of a hand-rolled SQL mock. This job didn't exist before
      # phase 3b — worker-positions previously had no PR-time test job at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install worker-positions dependencies
        working-directory: worker-positions
        run: npm ci
      - name: Run worker-positions tests
        working-directory: worker-positions
        run: npm test
