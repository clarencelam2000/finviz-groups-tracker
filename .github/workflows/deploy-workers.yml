name: Deploy Cloudflare Workers

on:
  push:
    # TODO(D1): change to [main] when default branch is renamed;
    # also update DISPATCH_REF in worker-cron/wrangler.toml at the same time.
    branches: [claude/elegant-babbage-hlxnfy]
    paths:
      - 'worker/**'
      - 'worker-cron/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

jobs:
  deploy-ticker-lookup:
    name: Deploy finviz-ticker-lookup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        working-directory: worker
        run: npm ci
      - name: Build taxonomy
        working-directory: worker
        run: npm run build:taxonomy
      - name: Run tests
        working-directory: worker
        run: npm test
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # build:taxonomy already ran above; call wrangler directly to avoid re-running it
        run: npx wrangler deploy

  deploy-cron-dispatcher:
    name: Deploy finviz-cron-dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker-cron/package-lock.json
      - name: Install dependencies
        working-directory: worker-cron
        run: npm ci
      - name: Run tests
        working-directory: worker-cron
        run: npm test
      - name: Deploy
        working-directory: worker-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
