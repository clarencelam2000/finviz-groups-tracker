name: Deploy Cloudflare Workers

on:
  push:
    # TODO(D1): change to [main] when default branch is renamed;
    # also update DISPATCH_REF in worker-cron/wrangler.toml at the same time.
    branches: [claude/elegant-babbage-hlxnfy]
    paths:
      - 'worker/**'
      - 'worker-cron/**'
      - 'worker-positions/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

jobs:
  deploy-ticker-lookup:
    name: Deploy finviz-ticker-lookup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        working-directory: worker
        run: npm ci
      - name: Build taxonomy
        working-directory: worker
        # Regenerates taxonomy_map.json and etf_overrides.json from the committed CSVs.
        # If this step fails it is a DATA VALIDATION error, not a worker code error —
        # an entry in data/etf_overrides.csv references a Finviz group name that no
        # longer exists in data/industries/ or data/sectors/snapshots.csv.
        # Fix: correct the name in data/etf_overrides.csv and re-push.
        run: npm run build:taxonomy
      - name: Run tests
        working-directory: worker
        run: npm test
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # build:taxonomy already ran above; call wrangler directly to avoid re-running it
        run: npx wrangler deploy

  deploy-cron-dispatcher:
    name: Deploy finviz-cron-dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker-cron/package-lock.json
      - name: Install dependencies
        working-directory: worker-cron
        run: npm ci
      - name: Run tests
        working-directory: worker-cron
        run: npm test
      - name: Deploy
        working-directory: worker-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  deploy-positions:
    name: Deploy finviz-positions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node 22, unlike the worker/worker-cron jobs above (still 20): worker-positions' test
      # harness (test/helpers/d1.js, WS5 phase 3b) uses Node 22's built-in `node:sqlite` to run
      # the real migrations against an in-memory DB for `npm test` below.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker-positions/package-lock.json
      - name: Install dependencies
        working-directory: worker-positions
        run: npm ci
      - name: Run tests
        working-directory: worker-positions
        run: npm test
      - name: Deploy
        working-directory: worker-positions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Secrets (POSITIONS_SESSION_SECRET, POSITIONS_AUTH_PASSPHRASE) and the D1 schema are
        # provisioned out-of-band and are NOT touched by `wrangler deploy`. See worker-positions/README.md.
        run: npm run deploy
