name: Generate AI Analysis
on:
  workflow_run:
    workflows: ["Daily Snapshot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_ai:
        type: boolean
        default: false
        description: 'Force regeneration even if no new delta data detected'

permissions:
  contents: write
  id-token: write   # required for WIF OIDC token issuance

concurrency:
  group: generate-ai
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt
        # Playwright is not needed — generate_ai.py never imports it

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Generate AI analysis
        id: ai_gen
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: global
          FORCE_AI: ${{ github.event.inputs.force_ai == 'true' && '1' || '' }}
          # AI_CAPTURE=1: write Tier-2 debug capture (data/ai/debug/{date}.json)
          # on every CI run so prompt+raw+parsed+usage+latency are never lost to
          # the ephemeral runner. Rolling 30-day window keeps HEAD bounded (~1 MB).
          AI_CAPTURE: '1'
        run: python scripts/generate_ai.py

      - name: Upload Tier-2 debug capture artifact
        # Upload data/ai/debug/ as a CI artifact for ergonomic long-term access
        # without git log spelunking. Kept for 90 days by GitHub Actions.
        # NOTE(reassess): review artifact volume once Phase 6 eval is live —
        # at that point consider whether the git history alone is sufficient.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-capture-${{ github.run_id }}
          path: data/ai/debug/
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git add data/
          git diff --cached --quiet || git commit -m "data: AI analysis $(TZ=America/New_York date +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}
