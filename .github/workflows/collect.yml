name: Daily Snapshot
on:
  schedule:
    # Times are weekday-only and chosen in Eastern, but GitHub cron is fixed UTC
    # and cannot follow DST. The UTC values below map to EDT (summer); in EST
    # (winter) each run fires one hour earlier in ET. Never schedule on weekends —
    # markets are closed and a weekend run would only re-capture Friday's stale
    # close (see trading_date() in scripts/collect.py).
    - cron: '49 13 * * 1-5'   # ~9:49 AM ET — just after the open
    - cron: '51 14 * * 1-5'   # ~10:51 AM ET — mid-morning
    - cron: '48 19 * * 1-5'   # ~3:48 PM ET — just before the close (EOD snapshot)
  workflow_dispatch:
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Collect snapshot
        id: collect
        run: python scripts/collect.py
      - name: Verify row counts
        id: verify
        run: |
          python - <<'EOF'
          import csv, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import pytz

          # Reuse the single source of truth so the verified date matches what
          # collect.py stored (weekend + holiday rollback included). Playwright
          # is installed by the earlier step, so importing scripts.collect works.
          from scripts.collect import trading_date

          eastern = pytz.timezone("US/Eastern")
          now_utc = datetime.now(timezone.utc)
          today = trading_date(datetime.now(eastern))

          FRESHNESS_MINUTES = 30
          checks = [("data/sectors/snapshots.csv", 8), ("data/industries/snapshots.csv", 100)]
          failed = False
          for path_str, min_rows in checks:
              path = Path(path_str)
              if not path.exists():
                  print(f"FAIL: {path_str} does not exist")
                  failed = True
                  continue
              with open(path) as f:
                  rows = [r for r in csv.DictReader(f) if r.get("date") == today]
              print(f"  {path_str}: {len(rows)} rows for {today}")
              if len(rows) < min_rows:
                  print(f"FAIL: expected >= {min_rows}, got {len(rows)}")
                  failed = True
                  continue
              # Freshness check: at least one row must have been collected recently.
              # Catches the case where stale same-day data satisfies the row count
              # but no fresh scrape actually ran (e.g. eviction failed silently).
              timestamps = []
              for r in rows:
                  ca = r.get("collected_at", "")
                  if ca:
                      try:
                          timestamps.append(datetime.fromisoformat(ca.replace("Z", "+00:00")))
                      except ValueError:
                          pass
              if not timestamps:
                  print(f"FAIL: {path_str}: no parseable collected_at values")
                  failed = True
              else:
                  age_m = (now_utc - max(timestamps)).total_seconds() / 60
                  print(f"  {path_str}: most recent collected_at is {age_m:.0f}m ago")
                  if age_m > FRESHNESS_MINUTES:
                      print(f"FAIL: {path_str}: data is {age_m:.0f}m old (limit {FRESHNESS_MINUTES}m)")
                      failed = True
          sys.exit(1 if failed else 0)
          EOF
      - name: Compute deltas
        id: deltas
        run: python scripts/compute_deltas.py
      - name: Log fetch result
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DELTAS_OUTCOME: ${{ steps.deltas.outcome }}
        run: |
          python - <<'EOF'
          import csv, os
          from datetime import datetime, timezone
          from pathlib import Path
          import pytz

          # Use the stored trading date (weekend + holiday rollback) so the
          # logged row counts reflect the date collect.py actually wrote.
          from scripts.collect import trading_date

          eastern = pytz.timezone("US/Eastern")
          run_date = trading_date(datetime.now(eastern))
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def count_today_rows(csv_path, run_date):
              p = Path(csv_path)
              if not p.exists():
                  return ""
              with open(p) as f:
                  rows = [r for r in csv.DictReader(f) if r.get("date") == run_date]
              return len(rows)

          sectors_rows = count_today_rows("data/sectors/snapshots.csv", run_date)
          industries_rows = count_today_rows("data/industries/snapshots.csv", run_date)

          collect_outcome = os.environ.get("COLLECT_OUTCOME", "")
          verify_outcome = os.environ.get("VERIFY_OUTCOME", "")
          deltas_outcome = os.environ.get("DELTAS_OUTCOME", "")
          all_steps = [("collect", collect_outcome), ("verify", verify_outcome), ("deltas", deltas_outcome)]
          overall = "success" if all(o == "success" for _, o in all_steps if o) else "failure"
          step_failed = ",".join(s for s, o in all_steps if o and o != "success")

          ai_outcome = ""
          ai_fields_missing = ""

          LOG_COLUMNS = ["timestamp", "run_date", "trigger", "run_id", "outcome",
                         "sectors_rows", "industries_rows", "step_failed",
                         "ai_outcome", "ai_fields_missing"]

          log_path = Path("data/fetch_log.csv")

          write_header = not log_path.exists() or log_path.stat().st_size == 0
          with open(log_path, "a", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=LOG_COLUMNS, extrasaction="ignore")
              if write_header:
                  writer.writeheader()
              writer.writerow({
                  "timestamp": timestamp,
                  "run_date": run_date,
                  "trigger": os.environ.get("GITHUB_EVENT_NAME", ""),
                  "run_id": os.environ.get("GITHUB_RUN_ID", ""),
                  "outcome": overall,
                  "sectors_rows": sectors_rows,
                  "industries_rows": industries_rows,
                  "step_failed": step_failed,
                  "ai_outcome": ai_outcome,
                  "ai_fields_missing": ai_fields_missing,
              })
          print(
              f"Logged {overall}: sectors={sectors_rows} industries={industries_rows} "
              f"step_failed={step_failed!r} ai={ai_outcome!r}"
          )
          EOF
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: snapshot $(TZ=America/New_York date +%Y-%m-%d)"
          git push
      - name: Ping healthcheck
        if: steps.collect.outcome == 'success' && steps.verify.outcome == 'success' && steps.deltas.outcome == 'success'
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          # Silently skip if secret not configured; otherwise ping to confirm success.
          # Setup: healthchecks.io → New Check → period 26h → copy URL → repo Settings → Secrets → HEALTHCHECK_URL
          [ -z "$HEALTHCHECK_URL" ] || curl -fsS --retry 3 "$HEALTHCHECK_URL" > /dev/null
