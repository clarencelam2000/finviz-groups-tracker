name: Daily Picks Scrape
# Stage-2 stock-picks scraper (Phase 2 of planning/stock-picks-from-leading-groups.md).
# Selects leading groups from data/industries/deltas.csv and logs individual stock
# rows into data/picks/picks.csv. Runs on Azure IPs (GitHub Actions) — Cloudflare
# blocks the headless screener scrape from Google Cloud IPs.
# PICKS-2-CRON: scheduled ONLY via the Cloudflare `finviz-cron-dispatcher`
# Worker (worker-cron/), which POSTs a workflow_dispatch at 22:31 UTC (6:31 PM
# EDT) — 90 min after the EOD collect.yml dispatch, so deltas.csv is pushed
# before picks select groups. There is deliberately NO GitHub `schedule:`
# backstop here (unlike collect.yml): this scrape costs up to 50 screener
# pages, GitHub cron drifts hours, and a drifted early fire trips the
# stale-read guard — a safe no-op, but then that day's unrecoverable picks
# list is lost until someone notices. Failure detection is the
# healthchecks.io dead-man's-switch pinged below instead.
on:
  workflow_dispatch:
permissions:
  contents: write
# Shared concurrency group with collect.yml (ADR-008 / G1): both jobs commit to
# data/ on the same branch, so they MUST serialize. cancel-in-progress: false so
# neither data job is killed mid-run. collect.yml declares the SAME group name —
# a group only serializes workflows that share the name, so both files need it.
concurrency:
  group: finviz-data-commit
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  picks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Collect picks
        id: picks
        env:
          PICKS_PAGE_DELAY: "3"
        run: python scripts/collect_picks.py
      - name: Upload raw HTML on parse failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picks-debug-html
          path: data/picks/debug_html/
          if-no-files-found: ignore
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/picks/
          git diff --cached --quiet || git commit -m "data: picks $(TZ=America/New_York date +%Y-%m-%d)"
          git pull --rebase
          git push
      - name: Ping healthcheck
        if: steps.picks.outcome == 'success'
        env:
          PICKS_HEALTHCHECK_URL: ${{ secrets.PICKS_HEALTHCHECK_URL }}
        run: |
          # Dead-man's-switch: with no GitHub cron backstop, a silently-failing
          # Cloudflare dispatch would otherwise go unnoticed until the picks
          # list is already lost. Silently skip if the secret isn't configured.
          # Setup: healthchecks.io → New Check → period 24h, grace 2h → copy URL
          # → repo Settings → Secrets → PICKS_HEALTHCHECK_URL
          [ -z "$PICKS_HEALTHCHECK_URL" ] || curl -fsS --retry 3 "$PICKS_HEALTHCHECK_URL" > /dev/null
