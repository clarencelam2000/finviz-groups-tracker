name: Held Feed
# WS5 phase 2 settled-EOD held-tickers quote feed (planning/trade-lifecycle-engine.md
# §5/§5a, ADR-012 §10/§11; issues #312, #297). Scrapes live quotes for every ticker in
# an open/managing/closing position (via the finviz-positions Worker's `/held-tickers`
# endpoint) and POSTs the full 84-column scrape to that Worker's authenticated
# `/ingest/quotes` endpoint, which writes to D1's `ticker_quotes` table.
#
# CRITICAL DIFFERENCE from collect.yml/collect_picks.yml/collect_morning.yml: this
# workflow writes to D1 over HTTP, NOT to git. There is no `git commit`/`git push` step
# and no `finviz-data-commit` concurrency group — this job never touches repo data, so
# it cannot conflict with the ones that do.
#
# PRIMARY scheduler: the Cloudflare `finviz-cron-dispatcher` Worker's in-code `held`
# job (worker-cron/src/routing.js JOB_SCHEDULE), firing at 17:30 ET, Mon-Fri, UNGATED
# (same rationale as `collect_morning` — the held set comes from a live Worker query,
# independent of collect.yml/compute_deltas.py, so there is nothing to dependency-gate
# on). Dispatched via workflow_dispatch on GitHub's Azure IPs, which pass Finviz's
# Cloudflare bot-detection; our own Cloudflare Worker's Google Cloud IPs do not (see
# root CLAUDE.md § Playwright notes).
#
# Required secrets (repo owner sets these out of band — NOT touched by wrangler deploy
# or by this workflow): POSITIONS_WORKER_URL, POSITIONS_INGEST_TOKEN. Both must be
# configured in the repo's Actions secrets before this workflow can succeed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape+map+log counts without POSTing to the ingest endpoint."
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  held:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Collect held-tickers quotes
        # Same inputs.dry_run ternary pattern as collect_morning.yml: a worker-cron
        # dispatch sends no inputs, so GitHub Actions defaults the unset boolean to
        # its declared `default` (false) -> a real POST.
        env:
          POSITIONS_WORKER_URL: ${{ secrets.POSITIONS_WORKER_URL }}
          POSITIONS_INGEST_TOKEN: ${{ secrets.POSITIONS_INGEST_TOKEN }}
        run: python scripts/collect_held.py ${{ inputs.dry_run && '--dry-run' || '' }}
