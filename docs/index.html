<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sectors">
  <meta name="theme-color" content="#0f172a">
  <title>Finviz Tracker</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    html, body { overscroll-behavior: none; }
    .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans select-none">

  <!-- Header -->
  <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur-sm border-b border-slate-700 px-4 pb-2"
          style="padding-top: calc(env(safe-area-inset-top) + 0.6rem)">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-white leading-tight">Finviz Tracker</h1>
        <p id="last-updated" class="text-xs text-slate-400">Loading…</p>
      </div>
      <button id="refresh-btn"
              class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-700 active:bg-slate-600 text-slate-300"
              aria-label="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Tab bar -->
  <nav id="tab-bar" class="sticky z-20 flex bg-slate-800 border-b border-slate-700 text-sm font-medium"
       style="top: calc(env(safe-area-inset-top) + 58px)">
    <button class="tab-btn flex-1 py-3 tab-active" data-tab="today">Today</button>
    <button class="tab-btn flex-1 py-3 text-slate-400" data-tab="movers">Movers</button>
    <button class="tab-btn flex-1 py-3 text-slate-400" data-tab="momentum">Momentum</button>
  </nav>

  <main>

    <!-- TAB: Today -->
    <section id="tab-today" class="px-3 pt-3 pb-24">
      <div class="flex bg-slate-800 rounded-lg p-1 mb-3">
        <button class="group-toggle-btn flex-1 py-2 rounded-md text-sm font-medium bg-slate-600 text-white transition-colors" data-group="sectors">Sectors</button>
        <button class="group-toggle-btn flex-1 py-2 rounded-md text-sm font-medium text-slate-400 transition-colors" data-group="industries">Industries</button>
      </div>
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs text-slate-400">Sort by</span>
        <select id="sort-metric" class="bg-slate-700 text-slate-200 rounded-lg px-2 py-1.5 text-xs border border-slate-600">
          <option value="perf_ytd">YTD %</option>
          <option value="perf_week">Week %</option>
          <option value="perf_month">Month %</option>
          <option value="perf_day">Day %</option>
        </select>
      </div>
      <div id="today-cards" class="space-y-2"></div>
    </section>

    <!-- TAB: Movers -->
    <section id="tab-movers" class="px-3 pt-3 pb-24 hidden">
      <div class="flex bg-slate-800 rounded-lg p-1 mb-3">
        <button class="group-toggle-btn flex-1 py-2 rounded-md text-sm font-medium bg-slate-600 text-white transition-colors" data-group="sectors">Sectors</button>
        <button class="group-toggle-btn flex-1 py-2 rounded-md text-sm font-medium text-slate-400 transition-colors" data-group="industries">Industries</button>
      </div>
      <div class="flex bg-slate-800 rounded-lg p-1 mb-4">
        <button class="lookback-btn flex-1 py-2 rounded-md text-sm font-medium bg-slate-600 text-white transition-colors" data-window="7d">7 Days</button>
        <button class="lookback-btn flex-1 py-2 rounded-md text-sm font-medium text-slate-400 transition-colors" data-window="14d">14 Days</button>
        <button class="lookback-btn flex-1 py-2 rounded-md text-sm font-medium text-slate-400 transition-colors" data-window="30d">30 Days</button>
      </div>
      <div id="movers-placeholder" class="rounded-xl bg-slate-800 border border-slate-700 p-6 text-center hidden">
        <div class="text-4xl mb-3">📅</div>
        <p class="text-white font-semibold mb-1">Data accumulating…</p>
        <p class="text-slate-400 text-sm mb-2">7-day rank changes appear after <span id="movers-date-7d" class="text-slate-200 font-medium">June 16</span>.</p>
        <p class="text-slate-500 text-xs">GitHub Actions collects data weekdays at 10pm UTC.</p>
      </div>
      <div id="movers-content" class="hidden">
        <h3 class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-2">Top Gainers — YTD Rank</h3>
        <div id="gainers-list" class="space-y-2 mb-5"></div>
        <h3 class="text-xs font-semibold text-red-400 uppercase tracking-wider mb-2">Top Losers — YTD Rank</h3>
        <div id="losers-list" class="space-y-2"></div>
      </div>
    </section>

    <!-- TAB: Momentum -->
    <section id="tab-momentum" class="px-3 pt-3 pb-24 hidden">
      <div class="flex bg-slate-800 rounded-lg p-1 mb-3">
        <button class="group-toggle-btn flex-1 py-2 rounded-md text-sm font-medium bg-slate-600 text-white transition-colors" data-group="sectors">Sectors</button>
        <button class="group-toggle-btn flex-1 py-2 rounded-md text-sm font-medium text-slate-400 transition-colors" data-group="industries">Industries</button>
      </div>
      <p class="text-xs text-slate-500 mb-3">Composite breadth score across all 7 timeframes. 100% = top in every timeframe.</p>
      <div id="momentum-list" class="space-y-2"></div>
    </section>

  </main>

  <script>
  (() => {
    const REPO   = 'clarencelam2000/finviz-groups-tracker';
    const BRANCH = 'claude/elegant-babbage-hlxnfy';
    const BASE   = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/data`;

    const URLS = {
      sectors:    { snap: `${BASE}/sectors/snapshots.csv`,    delta: `${BASE}/sectors/deltas.csv` },
      industries: { snap: `${BASE}/industries/snapshots.csv`, delta: `${BASE}/industries/deltas.csv` },
    };

    const state = {
      tab: 'today',
      group: 'sectors',
      lookback: '7d',
      sortMetric: 'perf_ytd',
      data: {
        sectors:    { snap: null, delta: null },
        industries: { snap: null, delta: null },
      },
      loading: false,
      expandedName: null,
    };

    // ── Preferences (localStorage) ─────────────────────────────────────────

    const PREFS_KEY = 'fvt_prefs_v1';

    function savePrefs() {
      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify({
          group: state.group, sortMetric: state.sortMetric, lookback: state.lookback,
        }));
      } catch(e) {}
    }

    function loadPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
        if (['sectors','industries'].includes(p.group)) state.group = p.group;
        if (['perf_ytd','perf_week','perf_month','perf_day'].includes(p.sortMetric)) state.sortMetric = p.sortMetric;
        if (['7d','14d','30d'].includes(p.lookback)) state.lookback = p.lookback;
      } catch(e) {}
    }

    function initUIFromState() {
      document.querySelectorAll('.group-toggle-btn').forEach(btn => {
        const active = btn.dataset.group === state.group;
        btn.classList.toggle('bg-slate-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-400', !active);
      });
      document.querySelectorAll('.lookback-btn').forEach(btn => {
        const active = btn.dataset.window === state.lookback;
        btn.classList.toggle('bg-slate-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-400', !active);
      });
      document.getElementById('sort-metric').value = state.sortMetric;
      const sc = document.getElementById('search-container');
      if (sc) sc.classList.toggle('hidden', state.group !== 'industries');
    }

    // ── Helpers ────────────────────────────────────────────────────────────

    function freshnessLabel(dateStr, collectedAt) {
      const dateMidnight = new Date(dateStr + 'T12:00:00');
      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dateMidnightLocal = new Date(dateMidnight.getFullYear(), dateMidnight.getMonth(), dateMidnight.getDate());
      const diffDays = Math.round((todayMidnight - dateMidnightLocal) / 86400000);
      const dow = now.getDay(); // 0=Sun, 6=Sat
      const weekendExpected = (dow === 0 || dow === 1 || dow === 6) && diffDays <= 3;

      let timeStr = '';
      if (collectedAt) {
        try {
          timeStr = ' · ' + new Date(collectedAt).toLocaleTimeString('en-US', {
            timeZone: 'America/Los_Angeles',
            hour: 'numeric', minute: '2-digit', hour12: true,
          }) + ' PT';
        } catch(e) {}
      }

      if (diffDays === 0)      return { text: `Data current · ${dateStr}${timeStr}`,        cls: 'text-xs text-emerald-400' };
      if (weekendExpected)     return { text: `Weekend · data from ${dateStr}${timeStr}`,   cls: 'text-xs text-slate-400' };
      if (diffDays === 1)      return { text: `Yesterday's data · ${dateStr}${timeStr}`,    cls: 'text-xs text-amber-400' };
      return                          { text: `Stale: ${dateStr} · ${diffDays}d${timeStr}`, cls: 'text-xs text-red-400' };
    }

    function pf(v) {
      const n = parseFloat(v);
      return isNaN(n) ? null : n;
    }

    function fmtPct(v, forceSign = false) {
      const n = pf(v);
      if (n === null) return '<span class="text-slate-600">—</span>';
      const sign = n > 0 ? '+' : '';
      return `<span class="${perfColor(n)}">${forceSign ? sign : (n < 0 ? '' : '')}${n > 0 ? '+' : ''}${n.toFixed(2)}%</span>`;
    }

    function perfColor(n) {
      if (n === null) return 'text-slate-400';
      if (n > 5)  return 'text-emerald-400';
      if (n > 0)  return 'text-green-300';
      if (n < -5) return 'text-red-400';
      if (n < 0)  return 'text-red-300';
      return 'text-slate-300';
    }

    function momentumStyle(score) {
      if (score >= 0.75) return { text: 'text-emerald-400', bar: 'bg-emerald-500' };
      if (score >= 0.50) return { text: 'text-sky-400',     bar: 'bg-sky-500' };
      if (score >= 0.25) return { text: 'text-amber-400',   bar: 'bg-amber-500' };
      return                    { text: 'text-red-400',     bar: 'bg-red-500' };
    }

    function getLatest(rows) {
      if (!rows || rows.length === 0) return [];
      const dates = [...new Set(rows.map(r => r.date).filter(Boolean))].sort();
      const latest = dates[dates.length - 1];
      return rows.filter(r => r.date === latest);
    }

    function hasMoversData(rows, win) {
      const col = `rank_ytd_delta_${win}`;
      return rows.some(r => r[col] !== '' && r[col] !== undefined && !isNaN(parseFloat(r[col])));
    }

    function skeleton(n) {
      return Array.from({ length: n }, () => `
        <div class="rounded-xl p-3 bg-slate-800 border border-slate-700 animate-pulse flex gap-3 items-center">
          <div class="w-7 h-7 rounded-full bg-slate-700 flex-shrink-0"></div>
          <div class="flex-1">
            <div class="h-4 bg-slate-700 rounded w-2/3 mb-2"></div>
            <div class="h-3 bg-slate-700 rounded w-1/3"></div>
          </div>
          <div class="w-14 h-8 bg-slate-700 rounded flex-shrink-0"></div>
        </div>`).join('');
    }

    // ── Data loading ───────────────────────────────────────────────────────

    function fetchCSV(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          download: true, header: true, skipEmptyLines: true,
          complete: resolve, error: reject,
        });
      });
    }

    async function loadGroup(group) {
      if (state.data[group].snap !== null) return; // already cached
      try {
        const [snapRes, deltaRes] = await Promise.all([
          fetchCSV(URLS[group].snap),
          fetchCSV(URLS[group].delta),
        ]);
        state.data[group].snap  = getLatest(snapRes.data);
        state.data[group].delta = getLatest(deltaRes.data);

        if (state.data[group].snap.length > 0) {
          const d = state.data[group].snap[0].date;
          const lbl = freshnessLabel(d, state.data[group].snap[0].collected_at);
          const el = document.getElementById('last-updated');
          el.textContent = lbl.text;
          el.className = lbl.cls;
          // Compute expected date for 7d movers
          const dt = new Date(d + 'T12:00:00');
          dt.setDate(dt.getDate() + 7);
          document.getElementById('movers-date-7d').textContent =
            dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
        }
      } catch (err) {
        showError(`Failed to load data. ${err.message || 'Check your connection.'}`);
      }
    }

    function showError(msg) {
      ['today-cards', 'movers-content', 'movers-placeholder', 'momentum-list'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '';
      });
      document.getElementById('today-cards').innerHTML = `
        <div class="rounded-xl p-5 bg-red-900/30 border border-red-700/50 text-center">
          <p class="text-red-300 text-sm mb-3">${msg}</p>
          <button onclick="window.__refresh()"
                  class="bg-red-800 text-red-100 rounded-lg px-4 py-2 text-sm active:bg-red-700">
            Retry
          </button>
        </div>`;
    }

    // ── Render: Today ──────────────────────────────────────────────────────

    function renderToday() {
      const snap  = state.data[state.group].snap  || [];
      const delta = state.data[state.group].delta || [];
      const container = document.getElementById('today-cards');

      if (snap.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">No data available.</p>';
        return;
      }

      // Merge snap + delta on name for rank lookup
      const deltaMap = Object.fromEntries(delta.map(r => [r.name, r]));

      const metric = state.sortMetric;
      const ALL_METRICS = [
        { key: 'perf_day',   label: 'Day' },
        { key: 'perf_week',  label: 'Wk'  },
        { key: 'perf_month', label: 'Mo'  },
        { key: 'perf_ytd',   label: 'YTD' },
      ];

      const siEl = document.getElementById('search-input');
      const query = siEl ? siEl.value.trim().toLowerCase() : '';
      let sorted = [...snap].sort((a, b) => (pf(b[metric]) ?? -999) - (pf(a[metric]) ?? -999));
      if (query) sorted = sorted.filter(row => row.name.toLowerCase().includes(query));

      container.innerHTML = sorted.map((row, i) => {
        const d = deltaMap[row.name] || {};
        const rank = pf(d.rank_ytd);
        const rankBadge = rank !== null
          ? `<span class="w-7 h-7 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-300 flex-shrink-0">${rank}</span>`
          : `<span class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs text-slate-600 flex-shrink-0">${i+1}</span>`;

        const mom = pf(d.momentum_score);
        const momStr = mom !== null ? `<span class="text-slate-500 text-xs">Mom ${(mom*100).toFixed(0)}%</span>` : '';

        const mainVal = pf(row[metric]);
        const mainColor = mainVal !== null ? perfColor(mainVal) : 'text-slate-400';
        const mainFmt = mainVal !== null ? `${mainVal > 0 ? '+' : ''}${mainVal.toFixed(2)}%` : '—';
        const metricLabel = { perf_ytd: 'YTD', perf_week: 'Wk', perf_month: 'Mo', perf_day: 'Day' }[metric] || metric;

        const borderColor = mainVal === null  ? 'border-l-slate-700'
          : mainVal > 2  ? 'border-l-emerald-500'
          : mainVal > 0  ? 'border-l-green-600'
          : mainVal < -2 ? 'border-l-red-500'
          :                'border-l-red-700';

        const trendDelta = pf(d.rank_ytd_delta_7d);
        const trendArrow = trendDelta !== null && trendDelta !== 0
          ? `<span class="${trendDelta > 0 ? 'text-emerald-400' : 'text-red-400'} text-xs ml-1">${trendDelta > 0 ? '↑' : '↓'}</span>`
          : '';

        const subMetrics = ALL_METRICS.filter(m => m.key !== metric).slice(0, 2);
        const subLine = subMetrics.map(m => `<span>${m.label}: ${fmtPct(row[m.key])}</span>`).join('');

        const isExpanded = state.expandedName === row.name;
        const q = pf(row.perf_quarter), h = pf(row.perf_half), y = pf(row.perf_year);
        const pe = pf(row.pe), cap = pf(row.market_cap);
        const capStr = cap === null ? '—' : cap >= 1000 ? '$' + (cap/1000).toFixed(1) + 'T' : '$' + cap.toFixed(0) + 'B';
        const expandedDetail = isExpanded ? `
          <div class="px-3 pb-3">
            <div class="border-t border-slate-700 pt-2 grid grid-cols-3 gap-1 text-xs text-center">
              <div><div class="${perfColor(q)}">${q !== null ? (q > 0 ? '+' : '') + q.toFixed(2) + '%' : '—'}</div><div class="text-slate-500 mt-0.5">Quarter</div></div>
              <div><div class="${perfColor(h)}">${h !== null ? (h > 0 ? '+' : '') + h.toFixed(2) + '%' : '—'}</div><div class="text-slate-500 mt-0.5">6-Month</div></div>
              <div><div class="${perfColor(y)}">${y !== null ? (y > 0 ? '+' : '') + y.toFixed(2) + '%' : '—'}</div><div class="text-slate-500 mt-0.5">1-Year</div></div>
            </div>
            <div class="grid grid-cols-3 gap-1 text-xs text-center mt-2">
              <div><div class="text-slate-300">${pe !== null ? pe.toFixed(1) : '—'}</div><div class="text-slate-500 mt-0.5">P/E</div></div>
              <div><div class="text-slate-300">${row.stocks || '—'}</div><div class="text-slate-500 mt-0.5">Stocks</div></div>
              <div><div class="text-slate-300">${capStr}</div><div class="text-slate-500 mt-0.5">Mkt Cap</div></div>
            </div>
          </div>` : '';

        return `
          <div class="rounded-xl bg-slate-800 border border-slate-700 border-l-4 ${borderColor} overflow-hidden" data-name="${row.name}">
            <div class="p-3 flex items-center gap-3">
              ${rankBadge}
              <div class="flex-1 min-w-0">
                <div class="font-medium text-sm text-white truncate">${row.name}${trendArrow}</div>
                <div class="flex gap-3 mt-0.5 text-xs flex-wrap">
                  ${subLine}
                  ${momStr}
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <div class="text-base font-bold ${mainColor}">${mainFmt}</div>
                <div class="text-xs text-slate-500">${metricLabel} ${isExpanded ? '▴' : '▾'}</div>
              </div>
            </div>
            ${expandedDetail}
          </div>`;
      }).join('');
    }

    // ── Render: Movers ─────────────────────────────────────────────────────

    function renderMovers() {
      const delta = state.data[state.group].delta || [];
      const placeholder = document.getElementById('movers-placeholder');
      const content     = document.getElementById('movers-content');

      if (delta.length === 0) {
        placeholder.classList.remove('hidden');
        content.classList.add('hidden');
        return;
      }

      const win = state.lookback;
      const col = `rank_ytd_delta_${win}`;

      if (!hasMoversData(delta, win)) {
        placeholder.classList.remove('hidden');
        content.classList.add('hidden');
        return;
      }

      placeholder.classList.add('hidden');
      content.classList.remove('hidden');

      const withData = delta
        .filter(r => r[col] !== '' && r[col] !== undefined && !isNaN(parseFloat(r[col])))
        .map(r => ({ ...r, _delta: pf(r[col]) }))
        .sort((a, b) => b._delta - a._delta);

      const gainers = withData.slice(0, 10);
      const losers  = [...withData].reverse().slice(0, 10);

      function moverCard(row, isGainer) {
        const delta = row._delta;
        const sign = delta > 0 ? '+' : '';
        const color = isGainer ? 'text-emerald-400' : 'text-red-400';
        const border = isGainer ? 'border-l-emerald-500' : 'border-l-red-500';
        const rank = pf(row.rank_ytd);
        const mom  = pf(row.momentum_score);
        const subline = [
          rank !== null ? `YTD #${rank}` : null,
          mom  !== null ? `Score ${(mom*100).toFixed(0)}%` : null,
        ].filter(Boolean).join(' · ');

        return `
          <div class="rounded-xl p-3 bg-slate-800 border border-slate-700 border-l-4 ${border} flex items-center gap-3">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-white truncate">${row.name}</div>
              <div class="text-xs text-slate-400 mt-0.5">${subline}</div>
            </div>
            <div class="text-right flex-shrink-0">
              <div class="text-base font-bold ${color}">${sign}${delta} spots</div>
              <div class="text-xs text-slate-500">vs ${win} ago</div>
            </div>
          </div>`;
      }

      document.getElementById('gainers-list').innerHTML = gainers.map(r => moverCard(r, true)).join('');
      document.getElementById('losers-list').innerHTML  = losers.map(r => moverCard(r, false)).join('');
    }

    // ── Render: Momentum ───────────────────────────────────────────────────

    function renderMomentum() {
      const delta = state.data[state.group].delta || [];
      const container = document.getElementById('momentum-list');

      if (delta.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">No data available.</p>';
        return;
      }

      const sorted = [...delta]
        .filter(r => r.momentum_score !== '' && r.momentum_score !== undefined)
        .sort((a, b) => (pf(b.momentum_score) ?? 0) - (pf(a.momentum_score) ?? 0));

      container.innerHTML = sorted.map((row, i) => {
        const score = pf(row.momentum_score) ?? 0;
        const style = momentumStyle(score);
        const pct   = (score * 100).toFixed(0);
        const rankYtd  = pf(row.rank_ytd);
        const rankWeek = pf(row.rank_week);
        const subParts = [
          rankYtd  !== null ? `YTD #${rankYtd}`  : null,
          rankWeek !== null ? `Week #${rankWeek}` : null,
        ].filter(Boolean).join(' · ');

        return `
          <div class="rounded-xl p-3 bg-slate-800 border border-slate-700 flex items-center gap-3">
            <span class="text-sm font-bold text-slate-500 w-5 text-right flex-shrink-0">${i+1}</span>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-white truncate">${row.name}</div>
              ${subParts ? `<div class="text-xs text-slate-400 mt-0.5">${subParts}</div>` : ''}
            </div>
            <div class="flex-shrink-0 w-16 text-right">
              <div class="text-sm font-bold ${style.text}">${pct}%</div>
              <div class="h-1.5 rounded-full bg-slate-700 mt-1 overflow-hidden">
                <div class="h-full rounded-full ${style.bar}" style="width:${pct}%"></div>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    // ── Master render ──────────────────────────────────────────────────────

    function render() {
      if (state.tab === 'today')    renderToday();
      if (state.tab === 'movers')   renderMovers();
      if (state.tab === 'momentum') renderMomentum();
    }

    function setLoading(on) {
      state.loading = on;
      const btn = document.getElementById('refresh-btn');
      btn.querySelector('svg').classList.toggle('spinning', on);
      if (on) {
        document.getElementById('today-cards').innerHTML = skeleton(5);
        document.getElementById('gainers-list').innerHTML = skeleton(3);
        document.getElementById('losers-list').innerHTML  = skeleton(3);
        document.getElementById('momentum-list').innerHTML = skeleton(5);
      }
    }

    async function loadAndRender() {
      setLoading(true);
      await Promise.all([loadGroup('sectors'), loadGroup('industries')]);
      setLoading(false);
      render();
    }

    // ── UI wiring ──────────────────────────────────────────────────────────

    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const active = btn.dataset.tab === tab;
        btn.classList.toggle('tab-active', active);
        btn.classList.toggle('text-slate-400', !active);
      });
      document.querySelectorAll('main section').forEach(s => {
        s.classList.toggle('hidden', s.id !== `tab-${tab}`);
      });
      if (!state.data[state.group].snap) {
        loadAndRender();
      } else {
        render();
      }
    }

    function switchGroup(group) {
      state.group = group;
      savePrefs();
      const sc = document.getElementById('search-container');
      const si = document.getElementById('search-input');
      if (sc) sc.classList.toggle('hidden', group !== 'industries');
      if (si && group !== 'industries') si.value = '';
      // Update all group toggles (Today, Movers, Momentum each have one)
      document.querySelectorAll('.group-toggle-btn').forEach(btn => {
        const active = btn.dataset.group === group;
        btn.classList.toggle('bg-slate-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-400', !active);
      });
      if (!state.data[group].snap) {
        loadAndRender();
      } else {
        render();
      }
    }

    function switchLookback(win) {
      state.lookback = win;
      savePrefs();
      document.querySelectorAll('.lookback-btn').forEach(btn => {
        const active = btn.dataset.window === win;
        btn.classList.toggle('bg-slate-600', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('text-slate-400', !active);
      });
      renderMovers();
    }

    // Expose refresh globally for the retry button
    window.__refresh = function() {
      state.data.sectors    = { snap: null, delta: null };
      state.data.industries = { snap: null, delta: null };
      document.getElementById('last-updated').textContent = 'Loading…';
      loadAndRender();
    };

    document.querySelectorAll('.tab-btn').forEach(btn =>
      btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

    document.querySelectorAll('.group-toggle-btn').forEach(btn =>
      btn.addEventListener('click', () => switchGroup(btn.dataset.group)));

    document.querySelectorAll('.lookback-btn').forEach(btn =>
      btn.addEventListener('click', () => switchLookback(btn.dataset.window)));

    document.getElementById('sort-metric').addEventListener('change', e => {
      state.sortMetric = e.target.value;
      savePrefs();
      renderToday();
    });

    document.getElementById('refresh-btn').addEventListener('click', window.__refresh);

    // ── Boot ───────────────────────────────────────────────────────────────

    loadPrefs();
    initUIFromState();
    loadAndRender();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/finviz-groups-tracker/sw.js')
          .catch(() => {}); // silently ignore in non-Pages environments
      });
    }

  })();
  </script>

</body>
</html>
