# Cloudflare Worker config for finviz-ticker-lookup.
#
# Before first deploy you must replace the KV namespace id below with the one
# printed by:  wrangler kv namespace create LOOKUP_CACHE
# and set the FMP key as a secret (NOT in this file): wrangler secret put FMP_API_KEY
name = "finviz-ticker-lookup"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 30-day cache TTL (overridable per-environment). 2592000 = 30 * 24 * 3600.
[vars]
CACHE_TTL_SECONDS = "2592000"

[[kv_namespaces]]
binding = "LOOKUP_CACHE"
id = "3ae4430be6dd40c3bb425b9f3e9edf3a"
