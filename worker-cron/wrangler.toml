# Cloudflare Worker config for finviz-cron-dispatcher.
#
# This Worker is a *scheduler only*: its Cron Triggers fire on time (Cloudflare
# cron is precise and event-driven, unlike GitHub's schedule: which drifts hours
# and is dropped under load) and POST workflow_dispatch to launch the existing,
# proven collect.yml on GitHub's Azure runners. It does NOT scrape Finviz — see
# planning/cloudflare-cron-scheduler.md for why the scrape stays on GitHub.
#
# Before first deploy:
#   1. Create the KV namespace and paste its id below:
#        wrangler kv namespace create DISPATCH_LOG
#   2. Set the GitHub PAT as a secret (NOT in this file):
#        wrangler secret put GITHUB_DISPATCH_TOKEN
#      The PAT is a GitHub fine-grained token scoped to THIS repo only, with
#      Actions: Read and write (nothing else).
name = "finviz-cron-dispatcher"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Cron Triggers (UTC, weekday-only, Monday=2 through Friday=6). Scheduled for summer EDT:
# - 21:01 UTC = 5:01 PM EDT — collect (EOD post-close)
# - 14:30 UTC = 10:30 AM EDT — collect (intraday)
# - 19:48 UTC = 3:48 PM EDT — collect (pre-close)
# - 22:31 UTC = 6:31 PM EDT — picks (EOD +90 min; deltas must be pushed first —
#   the margin covers collect.yml + compute_deltas + push; the stale-read guard
#   in collect_picks.py makes a too-early fire a safe no-op, but then that day's
#   picks list is lost, so keep this comfortably after the 21:01 collect).
#   The "31 22" expression must stay byte-identical to PICKS_CRON in src/index.js
#   — scheduled() routes picks-vs-collect by exact event.cron string match.
# NOTE: Cloudflare cron uses 1=Sunday, 2=Monday...6=Friday, 0=Saturday.
# Do NOT use 1-5 (that's Sunday-Thursday); use 2-6 for Monday-Friday.
# Also: Cloudflare cron is fixed-UTC with no DST support. Must adjust manually:
# - On 2nd Sunday of March: add 1 hour to UTC times (EST→EDT transition)
# - On 1st Sunday of November: subtract 1 hour from UTC times (EDT→EST transition)
# Winter UTC equivalents: ["22:01 * * 2-6", "20:48 * * 2-6", "31 23 * * 2-6"]
# (a winter shift of the picks cron also requires updating PICKS_CRON in src/index.js).
[triggers]
# ISSUE #252: the intraday 10:30 AM EDT collect cron ("30 14 * * 2-6") was
# removed to free a slot — the Cloudflare account has a hard 5-cron-trigger
# limit shared with unrelated `distil-*` workers, and that limit is what
# caused the picks cron below to fail to deploy in the first place. The
# intraday run was the safe one to cut: collect.py is last-write-wins per
# date, so the EOD run ("01 21") always overwrites it — no committed-data
# loss — and the 3:48 PM pre-close run ("48 19") remains as an EOD fallback.
crons = ["01 21 * * 2-6", "48 19 * * 2-6", "31 22 * * 2-6"]

[vars]
# The git ref that collect.yml runs on. Stored as a var (not a secret) so it can
# be changed without touching Worker code.
# TODO(D1): change to "main" once SPRINT.md task D1 (create main, set as default) is done.
DISPATCH_REF = "claude/elegant-babbage-hlxnfy"

[[kv_namespaces]]
binding = "DISPATCH_LOG"
# Created via: wrangler kv namespace create DISPATCH_LOG
id = "8edeadedaf9345748592320549669ff4"
